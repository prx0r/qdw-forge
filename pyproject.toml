[project]
name = "qdw-forge"
version = "0.1.0"
description = "Agent-native capability forge for QDW Estate"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8,<9", "respx>=0.22,<1", "ruff>=0.8,<1"]

[project.scripts]
qdw-forge = "qdw_forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdw_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 130
src = ["src", "tests"]
